    /* compare the student's scale with the key: the longest common sequence of

        for (i = m - 1; i >= 0; i -= 1) {

        bar.addEventListener('click', function (ev) {
            var b2 = ev.target.closest ? ev.target.closest('[data-rep]') : null, k, nm;
            if (!b2) { return; }
            k = b2.getAttribute('data-rep');
            if (k === 'close') { close(); return; }
            if (nmIn && !S._nm) { bar.querySelector('[data-repnote]').innerHTML = '<b style="color:#b42318;">Write your name first.</b>'; try { nmIn.focus(); } catch (e1) { /* optional */ } return; }
            clearTimeout(t1); fill();
            if (k === 'dl') {
                nm = STUDENT || S._nm || '';
                var blob = new Blob([reportHTML()], { type: 'text/html' }), a2 = document.createElement('a'), u = URL.createObjectURL(blob);
                a2.href = u; a2.download = 'report_' + fileSlug() + (nm ? '_' + repSlug(nm) : '') + '.html';
                document.body.appendChild(a2); a2.click(); a2.parentNode.removeChild(a2);
                setTimeout(function () { URL.revokeObjectURL(u); }, 10000);
                statTotals('отчёт скачан', '');
                return;
            }
            if (k === 'print') {
                try { fr.contentWindow.focus(); fr.contentWindow.print(); statTotals('отчёт – печать', ''); }
                catch (e2) { window.alert('This browser cannot print. Use “Download the report” instead.'); }
            }
        });
        statTotals('отчёт открыт', '');
    }
    function svClick(b) {
        var kind = b.getAttribute('data-sv');
        if (kind === 'report') { printReport(); return; }
        if (kind === 'save') {
            saveNow();
            var old = b.textContent;
            if (!b.classList.contains('pbtn')) { b.classList.add('saved'); }
            b.textContent = 'Saved ✓';
            setTimeout(function () { b.textContent = old; b.classList.remove('saved'); }, 1400);
            return;
        }
        if (kind === 'file') {
            saveNow();
            var blob = new Blob([JSON.stringify({ app: 'phx-work', title: SET.title || '', saved: new Date().toISOString(), work: pack(S) })], { type: 'application/json' });
            var a = document.createElement('a'), u = URL.createObjectURL(blob);
            a.href = u; a.download = fileSlug() + '_my_work.json';
            document.body.appendChild(a); a.click(); a.parentNode.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
            return;
        }
        if (kind === 'open') { R.querySelector('[data-svfile]').click(); }
    }
    R.addEventListener('change', function (ev) {
        var inp = ev.target;
        if (!inp.hasAttribute || !inp.hasAttribute('data-svfile') || !inp.files || !inp.files[0]) { return; }
        var fr = new FileReader();
        fr.onload = function () {
            var o = null, L, id, n = 0, has = false;
            try { o = JSON.parse(String(fr.result || '')); } catch (e) { o = null; }
            if (!o || o.app !== 'phx-work' || !o.work) { window.alert('This is not a file with your work from this page.'); return; }
            L = unpack(o.work);
            for (id in L) { if (ITEMS[id]) { n += 1; } }
            if (!n) { window.alert('This file belongs to another exercise.'); return; }
            for (id in S) { if (ITEMS[id] && S[id] && (S[id].t || (S[id].g && S[id].g.length))) { has = true; } }
            if (has && !window.confirm('Replace your current answers with the answers from the file' + (o.saved ? ' (saved ' + String(o.saved).slice(0, 10) + ')' : '') + '?')) { return; }
            if (TEST) {
                var at0 = S._at || {}, sc0 = S._sc || {}, tk;
                L._at = L._at || {}; L._sc = L._sc || {};
                for (tk in at0) {
                    if (!Object.prototype.hasOwnProperty.call(at0, tk)) { continue; }
                    if (at0[tk] > (L._at[tk] || 0)) { L._at[tk] = at0[tk]; if (typeof sc0[tk] === 'number') { L._sc[tk] = sc0[tk]; } }
                    if (at0[tk] >= 2) { L[tk] = S[tk]; }
                }
            }
            if (TEST) {
                var dk, dkeys = ['d', 'dc', 'da', 'dv', 'ds', 'w', 'wc', 'wa', 'wv', 'ws'], cur, nx, z3;
                for (dk in ITEMS) {
                    if (!Object.prototype.hasOwnProperty.call(ITEMS, dk) || !S[dk]) { continue; }
                    cur = S[dk]; nx = L[dk] || (L[dk] = { t: '', m: {}, g: [] });
                    if ((cur.da || 0) > (nx.da || 0) || (cur.dv && !nx.dv) || (cur.wa || 0) > (nx.wa || 0) || (cur.wv && !nx.wv)) {
                        for (z3 = 0; z3 < dkeys.length; z3 += 1) { if (cur[dkeys[z3]] != null) { nx[dkeys[z3]] = cur[dkeys[z3]]; } else { delete nx[dkeys[z3]]; } }
                    }
                }
            }
            S = L;
            restoreUI();
            saveNow();
        };
        fr.readAsText(inp.files[0]);
        inp.value = '';
    });
    document.addEventListener('keydown', function (ev) {
        if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && (ev.key === 's' || ev.key === 'S' || ev.key === 'ы' || ev.key === 'Ы')) { ev.preventDefault(); saveNow(); }
    });
    if (SCO) { document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { commitNow(); } }); }

    R.addEventListener('click', function (ev) {
        var t = ev.target, b;
        if ((b = t.closest('[data-sv]'))) { svClick(b); return; }
        if ((b = t.closest('[data-aud]'))) { audClick(b); return; }
        if ((b = t.closest('[data-ins]'))) { insert(b.getAttribute('data-ins')); return; }
        if ((b = t.closest('[data-cmd]'))) { command(b.getAttribute('data-cmd')); return; }
        if ((b = t.closest('[data-tgset]'))) { pickTool(b.getAttribute('data-tgset')); return; }
        if ((b = t.closest('[data-tg]'))) { toggleType(b.getAttribute('data-tg')); return; }
        if ((b = t.closest('[data-pact]'))) {
            if (b.getAttribute('data-pact') === 'none' && popFor) {
                delete st(popFor.id).m[popFor.at]; save(); renderPills(popFor.id, popFor.at); resetCheck(popFor.id);
            }
            var back = popFor ? popFor.btn : null;
            closePop();
            if (back) { back.focus({ preventScroll: true }); }
            return;
        }
        if ((b = t.closest('[data-spot]'))) { if (narrow.matches) { setOpen(false); } openPop(b); return; }
        if ((b = t.closest('[data-dact]'))) {
            var did = itemOf(b).getAttribute('data-item'), dact = b.getAttribute('data-dact');
            if (dact === 'dcheck') { dCheck(did); } else if (dact === 'dshow') { dShow(did); } else if (dact === 'wcheck') { wCheck(did); } else if (dact === 'wshow') { wShow(did); }
            return;
        }
        if ((b = t.closest('button[data-sw]'))) { wToggle(b); return; }
        if ((b = t.closest('[data-act]'))) {
            var id = itemOf(b).getAttribute('data-item'), a = b.getAttribute('data-act');
            closePop();
            if (a === 'check') { check(id); }
            if (a === 'key') { showKey(id, b); }
            if (a === 'clear') { clearItem(id); }
            return;
        }
        if ((b = t.closest('[data-ex]'))) { showEx(b.getAttribute('data-ex'), false); return; }
        if ((b = t.closest('[data-goex]'))) { showEx(b.getAttribute('data-goex'), false); var et = R.querySelector('.extabs'); if (et && et.scrollIntoView) { et.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
        if ((b = t.closest('[data-handle]'))) { setOpen(aside.classList.contains('collapsed')); return; }
        if ((b = t.closest('[data-atab]'))) { showAtab(b.getAttribute('data-atab')); return; }
    });

    document.addEventListener('mousedown', function (ev) {
        if (popFor && !pop.contains(ev.target) && !ev.target.closest('[data-spot]')) { closePop(); }
    });
    document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape' && popFor) { var bb = popFor.btn; closePop(); bb.focus(); }
    });

    var exTabs = R.querySelectorAll('[data-ex]');
    for (q = 0; q < exTabs.length; q += 1) {
        exTabs[q].addEventListener('keydown', function (ev) {
            var cur = parseInt(this.getAttribute('data-ex'), 10), tot = exTabs.length, nx = null;
            if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') { nx = (cur + 1) % tot; }
            if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') { nx = (cur + tot - 1) % tot; }
            if (nx !== null) { ev.preventDefault(); showEx(nx, true); }
        });
    }

    mountScales();
    renderStages();
    progress();
    saveStatus();
    if (SCALE_TAB) {
        R.addEventListener('focusin', function (ev) {
            if (ev.target.classList && ev.target.classList.contains('tgx-wrap')) { showAtab('scale'); }
        });
    }
    renderAllPills();
    testAll();
    progress();


}());
</script>
